spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/vitalsense_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
      platform: postgres
security:
  oauth2:
     client:
        registration:
         google:
            client-id: ${GOOGLE_CLIENT_ID:pon_tu_id_de_prueba}
            client-secret: ${GOOGLE_CLIENT_SECRET:pon_tu_secret_de_prueba}
            scope:
              - email
              - profile