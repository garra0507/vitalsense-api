services:
  - type: db
    name: vitalsense-db
    runtime: postgres
    plan: free

  - type: web
    name: vitalsense-api
    runtime: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: vitalsense-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: vitalsense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vitalsense-db
          property: password
